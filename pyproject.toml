[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "henry-castillo"
dynamic = ["version"]
description = "Henry Castillo's personal website + CLI business card."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Henry Castillo" }]
keywords = ["cli", "business-card", "personal-website"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
]
dependencies = [
  "rich>=13",
  "questionary>=2",
]

[project.optional-dependencies]
lab = ["torch", "transformers", "textual"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "ty",
  "pre-commit>=3.8",
]

[project.urls]
Homepage = "https://github.com/d0rbu/d0rbu"
Repository = "https://github.com/d0rbu/d0rbu"

[project.scripts]
henry-castillo = "henry_castillo.__main__:main"
d0rbu = "henry_castillo.__main__:main"
d0rb = "henry_castillo.__main__:main"
hc = "henry_castillo.__main__:main"
henry = "henry_castillo.__main__:main"
secret-string-lol = "henry_castillo.__main__:main"

[tool.hatch.version]
path = "src/henry_castillo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/henry_castillo"]

[tool.hatch.build.targets.wheel.force-include]
"src/henry_castillo/py.typed" = "henry_castillo/py.typed"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["packages/npm"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF", "TID", "PL", "S"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["henry_castillo"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.10"
root = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config --cov=henry_castillo --cov-report=term-missing --cov-report=xml --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["henry_castillo"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

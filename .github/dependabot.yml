version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule: { interval: "weekly" }
    commit-message: { prefix: "build" }
    # Supply-chain: let releases age >=7 days before a bump is proposed so a
    # freshly compromised or yanked version is not auto-PR'd.
    cooldown:
      default-days: 7
    groups:
      python-deps: { patterns: ["*"] }
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    commit-message: { prefix: "ci" }
    cooldown:
      default-days: 7
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: "npm"
    directory: "/packages/npm"
    schedule: { interval: "weekly" }
    commit-message: { prefix: "build" }
    cooldown:
      default-days: 7
    groups:
      ts-deps: { patterns: ["*"] }

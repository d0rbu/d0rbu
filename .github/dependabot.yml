version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule: { interval: "weekly" }
    commit-message: { prefix: "build" }
    groups:
      python-deps: { patterns: ["*"] }
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    commit-message: { prefix: "ci" }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: "npm"
    directory: "/packages/npm"
    schedule: { interval: "weekly" }
    commit-message: { prefix: "build" }
    groups:
      ts-deps: { patterns: ["*"] }

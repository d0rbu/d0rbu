version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule: { interval: "weekly" }
    commit-message: { prefix: "build" }
    # Supply-chain: let releases age before a bump is proposed so a freshly
    # compromised/yanked version is not auto-PR'd. >=7 days is the floor.
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python-deps: { patterns: ["*"] }
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    commit-message: { prefix: "ci" }
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: "npm"
    directory: "/packages/npm"
    schedule: { interval: "weekly" }
    commit-message: { prefix: "build" }
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      ts-deps: { patterns: ["*"] }

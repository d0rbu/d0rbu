name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · type · lock · pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.10"
      - run: uv sync --extra dev
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv lock --locked
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python }}
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: uv python install "$PYTHON_VERSION"
      - name: Sync dependencies for Python ${{ matrix.python }}
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: uv sync --extra dev --python "$PYTHON_VERSION"
      - name: Run tests for Python ${{ matrix.python }}
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: uv run --python "$PYTHON_VERSION" pytest
      # Upload coverage from a single representative stable version
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    name: build (sdist+wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build
      - run: uvx twine check dist/*

  security:
    name: security (pip-audit · gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv export --frozen --no-emit-project --no-dev -o requirements-audit.txt
      - run: uvx pip-audit -r requirements-audit.txt
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  actions-lint:
    name: workflow static analysis (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uvx zizmor --persona=pedantic --config .github/zizmor.yml .github/workflows

  pr-title:
    name: conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read  # needed to read the PR title for conventional commit validation
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + changelog only; do not publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build + changelog + SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: uv build
      - run: uvx twine check dist/*
      - run: uvx git-cliff --latest --output RELEASE_NOTES.md
      - run: uv export --frozen --no-emit-project --no-dev -o requirements-sbom.txt
      - run: uvx cyclonedx-py requirements requirements-sbom.txt -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*
            sbom.json
            RELEASE_NOTES.md

  publish:
    name: publish to PyPI (Trusted Publishing)
    needs: build
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: .
      - run: mkdir -p dist && find dist -maxdepth 1 -type f -name '*.whl' -o -name '*.tar.gz' | head -1
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github-release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the GitHub Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: artifacts
      - run: gh release create "${GITHUB_REF_NAME}" artifacts/dist/* artifacts/sbom.json --notes-file artifacts/RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
